<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <!-- Para el form para agregar comida -->
    </section>

  <form id="crearcomidas">
    <label for="nombre">Nombre de la comida</label>
    <input type="text"name="nombre"placeholder="Nombre de la comida"required>  
  
    <label for="categoria">Categoria de la comida</label>
    <input type="text"name="categoria"placeholder="Categoria de la comida"required> 

    <label for="provincia">Provincia</label>
    <input type="text"name="provincia"placeholder="Provincia"required> 

    <label for="ingredientes">ingrediente</label>
    <input type="text"name="ingredientes"placeholder="ingredientes,...,...,"required> 
  
    <button type="submit">Crear</button>
  </form>

    <script src="main.js"></script>
</body>
</html>
